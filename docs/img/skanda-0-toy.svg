<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker><marker id="aec4899" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1240" height="1000" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1f2937">How Skanda-0 reads an image: the toy version</text>
<text x="40" y="80" font-size="15" fill="#6b7280">One model writes the report; every finding it writes carries a [SEG] token that becomes that finding's outline. X-ray, CT and MRI alike.</text>
<rect x="40" y="120" width="170" height="200" rx="10" fill="#111827"/><ellipse cx="94.4" cy="220.0" rx="34.0" ry="72.0" fill="#4b5563"/><ellipse cx="155.60000000000002" cy="220.0" rx="34.0" ry="72.0" fill="#4b5563"/><ellipse cx="135.2" cy="252.0" rx="23.8" ry="32.0" fill="#9ca3af"/><ellipse cx="91.0" cy="260.0" rx="15.299999999999999" ry="18.0" fill="#d1d5db" opacity=".75"/><text x="63.8" y="312" font-size="11" fill="#9ca3af">R</text><text x="179.4" y="312" font-size="11" fill="#9ca3af">L</text>
<text x="125" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">1 · the image</text>
<line x1="215" y1="220" x2="262" y2="220" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="265" y="125" width="250" height="190" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/><circle cx="287" cy="149" r="14" fill="#f59e0b"/><text x="287" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="309" y="155" font-size="18" font-weight="700" fill="#1f2937">The eyes</text><text x="281" y="183" font-size="14" fill="#1f2937">Qwen3-VL vision encoder</text><text x="281" y="204" font-size="14" fill="#1f2937">cuts the image into patches</text><text x="281" y="225" font-size="14" fill="#1f2937">and turns them into</text><text x="281" y="246" font-size="14" fill="#1f2937">image tokens</text><rect x="363" y="283" width="142" height="22" rx="11" fill="#f59e0b"/><text x="434.0" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">LoRA · LAST 11</text>
<line x1="518" y1="220" x2="565" y2="220" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="568" y="125" width="270" height="190" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/><circle cx="590" cy="149" r="14" fill="#f59e0b"/><text x="590" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="612" y="155" font-size="18" font-weight="700" fill="#1f2937">The brain</text><text x="584" y="183" font-size="14" fill="#1f2937">Qwen3-VL 30B language model</text><text x="584" y="204" font-size="14" fill="#1f2937">(mixture of experts, 3B active)</text><text x="584" y="225" font-size="14" fill="#1f2937">reads the image tokens and</text><text x="584" y="246" font-size="14" fill="#1f2937">writes the report, word by word</text><rect x="776" y="283" width="52" height="22" rx="11" fill="#f59e0b"/><text x="802.0" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">LoRA</text>
<line x1="841" y1="220" x2="888" y2="220" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="891" y="110" width="310" height="225" rx="16" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/><circle cx="913" cy="134" r="14" fill="#1f2937"/><text x="913" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="935" y="140" font-size="18" font-weight="700" fill="#1f2937">The report</text>
<text x="906" y="170" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">{ "normal": false,</text>
<text x="906" y="192" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">  "findings": [{</text>
<text x="906" y="214" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">    "title": "Effusion, right",</text>
<text x="906" y="236" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">    "evidence": "...",</text>
<text x="906" y="258" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">    "location": "right lower zone",</text>
<text x="906" y="280" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">    "mask": <tspan fill="#ec4899" font-weight="800">[SEG]</tspan> }],</text>
<text x="906" y="302" font-size="13.5" font-family="ui-monospace, Menlo, monospace" xml:space="preserve" fill="#1f2937">  "impression": "..." }</text>
<path d="M1080,306 C1080,380 760,360 735,445" fill="none" stroke="#ec4899" stroke-width="3.5" marker-end="url(#aec4899)"/>
<text x="930" y="385" font-size="14" font-weight="700" fill="#ec4899">the brain's "thought" at the [SEG] word</text>
<text x="930" y="405" font-size="13" fill="#ec4899">(its last hidden state, 2048 numbers)</text>
<path d="M828,318 C872,360 862,525 886,540" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a10b981)"/>
<rect x="891" y="455" width="310" height="185" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/><circle cx="913" cy="479" r="14" fill="#10b981"/><text x="913" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">8</text><text x="935" y="485" font-size="18" font-weight="700" fill="#1f2937">The score head</text><text x="907" y="513" font-size="14" fill="#1f2937">one linear layer on the brain's</text><text x="907" y="534" font-size="14" fill="#1f2937">state just before it replies:</text><text x="907" y="555" font-size="14" fill="#1f2937">p(abnormal) + 13 X-ray classes</text><text x="907" y="576" font-size="14" fill="#1f2937">→ hint line and normal gate</text><rect x="1148" y="608" width="43" height="22" rx="11" fill="#10b981"/><text x="1169.5" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">NEW</text>
<rect x="568" y="450" width="270" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/><circle cx="590" cy="474" r="14" fill="#10b981"/><text x="590" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text><text x="612" y="480" font-size="18" font-weight="700" fill="#1f2937">The translator</text><text x="584" y="508" font-size="14" fill="#1f2937">[SEG] projector, a small MLP</text><text x="584" y="529" font-size="14" fill="#1f2937">2048 → 2048 → 256 numbers:</text><text x="584" y="550" font-size="14" fill="#1f2937">turns the thought into an</text><text x="584" y="571" font-size="14" fill="#1f2937">outline request for SAM 2</text><rect x="785" y="588" width="43" height="22" rx="11" fill="#10b981"/><text x="806.5" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">NEW</text>
<line x1="565" y1="535" x2="518" y2="535" stroke="#ec4899" stroke-width="3" marker-end="url(#aec4899)"/>
<rect x="265" y="430" width="250" height="210" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/><circle cx="287" cy="454" r="14" fill="#f59e0b"/><text x="287" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text><text x="309" y="460" font-size="18" font-weight="700" fill="#1f2937">The outline pen</text><text x="281" y="488" font-size="14" fill="#1f2937">SAM 2.1 (from Sa2VA)</text><text x="281" y="509" font-size="14" fill="#1f2937"></text><text x="281" y="530" font-size="14" fill="#1f2937"></text><text x="281" y="551" font-size="14" fill="#1f2937">mask decoder draws the</text><text x="281" y="572" font-size="14" fill="#1f2937">outline + object score</text><rect x="426" y="608" width="79" height="22" rx="11" fill="#f59e0b"/><text x="465.5" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">TRAINED</text>
<rect x="281" y="500" width="218" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="390" y="522" text-anchor="middle" font-size="13" fill="#1f2937">its own eyes: image encoder <tspan font-weight="700" fill="#3b82f6">frozen</tspan></text>
<path d="M125,352 C125,420 210,470 262,500" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a6b7280)"/>
<text x="128" y="410" text-anchor="end" font-size="13" font-style="italic" fill="#6b7280">same image,</text><text x="128" y="428" text-anchor="end" font-size="13" font-style="italic" fill="#6b7280">at 1024²</text>
<line x1="262" y1="535" x2="215" y2="590" stroke="#ec4899" stroke-width="3" marker-end="url(#aec4899)"/>
<rect x="40" y="520" width="170" height="200" rx="10" fill="#111827"/><ellipse cx="94.4" cy="620.0" rx="34.0" ry="72.0" fill="#4b5563"/><ellipse cx="155.60000000000002" cy="620.0" rx="34.0" ry="72.0" fill="#4b5563"/><ellipse cx="135.2" cy="652.0" rx="23.8" ry="32.0" fill="#9ca3af"/><ellipse cx="91.0" cy="660.0" rx="15.299999999999999" ry="18.0" fill="#d1d5db" opacity=".75"/><ellipse cx="91.0" cy="660.0" rx="17.0" ry="20.0" fill="#ec4899" fill-opacity=".35" stroke="#ec4899" stroke-width="2.5"/><rect x="70.0" y="636.0" width="42.0" height="48.0" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="5 4"/><text x="63.8" y="712" font-size="11" fill="#9ca3af">R</text><text x="179.4" y="712" font-size="11" fill="#9ca3af">L</text>
<text x="125" y="745" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">7 · one outline per finding</text>
<text x="125" y="765" text-anchor="middle" font-size="12" fill="#6b7280">box = the outline's extent</text>
<text x="40" y="800" font-size="20" font-weight="800" fill="#1f2937">How it learns</text>
<rect x="40" y="818" width="280" height="118" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="54" y="846" font-size="16" font-weight="800" fill="#1f2937">Stage 0 <tspan font-weight="500" fill="#6b7280">· connector</tspan></text><text x="54" y="874" font-size="13.5" fill="#1f2937">teach the translator + pen:</text><text x="54" y="895" font-size="13.5" fill="#1f2937">"outline the heart" → outline</text>
<line x1="321" y1="877" x2="334" y2="877" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="336" y="818" width="280" height="118" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="350" y="846" font-size="16" font-weight="800" fill="#1f2937">Stage 1 <tspan font-weight="500" fill="#6b7280">· SFT, 2D</tspan></text><text x="350" y="874" font-size="13.5" fill="#1f2937">write reports with one [SEG]</text><text x="350" y="895" font-size="13.5" fill="#1f2937">per finding; X-ray, CT, MRI</text>
<line x1="617" y1="877" x2="630" y2="877" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="632" y="818" width="280" height="118" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="646" y="846" font-size="16" font-weight="800" fill="#1f2937">Stage 2 <tspan font-weight="500" fill="#6b7280">· 3D volumes</tspan></text><text x="646" y="874" font-size="13.5" fill="#1f2937">one outline across slices,</text><text x="646" y="895" font-size="13.5" fill="#1f2937">40% 2D replay</text>
<line x1="913" y1="877" x2="926" y2="877" stroke="#6b7280" stroke-width="3" marker-end="url(#a6b7280)"/>
<rect x="928" y="818" width="280" height="118" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="942" y="846" font-size="16" font-weight="800" fill="#1f2937">Stage 3 <tspan font-weight="500" fill="#6b7280">· X-ray polish</tspan></text><text x="942" y="874" font-size="13.5" fill="#1f2937">X-ray reports at 0.3× lr,</text><text x="942" y="895" font-size="13.5" fill="#1f2937">15% 3D replay</text>
<text x="40" y="965" font-size="13" fill="#6b7280">Loss = report text (cross-entropy, JSON boilerplate × 0.3) + 2 × outline BCE + 0.5 × outline Dice + 0.2 × object-score BCE + 0.5 × score-head BCE.</text>
<text x="40" y="987" font-size="13" fill="#6b7280">Blue = frozen · orange = fine-tuned · green = new · pink = the [SEG] path. A stage is kept only if its check on validation data is not worse than the best so far.</text>
</svg>